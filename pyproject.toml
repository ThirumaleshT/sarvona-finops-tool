[project]
name = "finops-optimizer"
version = "1.0.0"
description = "Multi-cloud FinOps tool for AWS and Azure cost optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-costmanagement>=2.0.1",
    "azure-mgmt-compute>=35.0.0",
    "azure-mgmt-resource>=20.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
]

[project.scripts]
finops = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"